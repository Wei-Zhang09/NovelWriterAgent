<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>NovelWriter Agent</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <span class="brand">NovelWriter Agent</span>
      <span class="phase">STEP 2 · 项目与章节</span>
      <span class="ver" id="ver">—</span>
    </header>

    <main class="panes">
      <!-- 左栏：切对象 -->
      <aside class="pane pane--nav">
        <h2>小说导航</h2>
        <div id="nav" class="nav"></div>
      </aside>

      <!-- 中栏：主体内容 -->
      <section class="pane pane--doc">
        <div id="center" class="center"></div>
      </section>

      <!-- 右栏：动作 + 诊断 -->
      <aside class="pane pane--agent">
        <h2>运行与诊断</h2>
        <div id="agent" class="agent"></div>
      </aside>
    </main>
  </div>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
