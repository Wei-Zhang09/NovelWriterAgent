<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>NovelWriter Agent</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <span class="brand">NovelWriter Agent</span>
      <span class="phase">v1.0 · 长篇创作</span>
      <!-- §41 顶栏四要素：项目 / 当前章 / 模型 / Run 状态
           ⚠ 四项都是「当前状态」，由 renderTopbar() 从真实数据填，
             不放静态文字 —— 静态文字会与实际状态分叉且没人发现。 -->
      <span class="topbar__facts" id="topbar">
        <span class="fact"><span class="fact__k">项目</span><span class="fact__v" id="fact-project">—</span></span>
        <span class="fact"><span class="fact__k">当前章</span><span class="fact__v" id="fact-chapter">未选择</span></span>
        <span class="fact"><span class="fact__k">模型</span><span class="fact__v" id="fact-model">未配置</span></span>
        <span class="fact"><span class="fact__k">Run</span><span class="fact__v" id="fact-run">空闲</span></span>
      </span>
      <span class="ver" id="ver">—</span>
      <!-- 主题切换：偏好落盘在用户级 prefs.json，重开保留 -->
      <button class="theme-toggle" id="theme" type="button" aria-pressed="false">☾ 暗色</button>
    </header>

    <main class="panes">
      <!-- 左栏：切对象 -->
      <aside class="pane pane--nav">
        <h2>小说导航</h2>
        <div id="nav" class="nav"></div>
      </aside>

      <!-- 中栏：主体内容 -->
      <section class="pane pane--doc">
        <div id="center" class="center"></div>
      </section>

      <!-- 右栏：动作 + 诊断 -->
      <aside class="pane pane--agent">
        <h2>运行与诊断</h2>
        <div id="agent" class="agent"></div>
      </aside>
    </main>
  </div>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
